# Throwaway Nextcloud + PostgreSQL for the compatibility tests, brought up by tests/ci/stack.sh
# (see CLAUDE.md). PostgreSQL shares Nextcloud's network namespace and is reached on localhost,
# and the tests talk to Nextcloud through `docker compose exec`, so no port is published (unless
# NC_PORT is set, for a browser: compose.ports.yml) and the containers need no traffic between them. FACETAG_NETWORK puts Nextcloud on an existing docker
# network instead of the project's own (stack.sh adds compose.network.yml for that).
name: ${COMPOSE_PROJECT_NAME:-facetag-ci}

services:
  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34}-apache
    environment:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
      NEXTCLOUD_ADMIN_USER: admin
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-admin-throwaway}
      NEXTCLOUD_TRUSTED_DOMAINS: localhost
      PHP_MEMORY_LIMIT: 2G
    volumes:
      - ../..:/facetag-src:ro
      - ${FACETAG_CACHE:-../../.cache}:/ci-cache:ro
      # PHP re-reads changed files at once (the version-guard test swaps one in)
      - ./php-ci.ini:/usr/local/etc/php/conf.d/zz-facetag-ci.ini:ro
    labels:
      com.centurylinklabs.watchtower.enable: "false"

  db:
    image: postgres:17-alpine
    network_mode: service:nextcloud
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: nextcloud
    tmpfs:
      - /var/lib/postgresql/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
