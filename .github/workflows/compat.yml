# Run the app against real Nextcloud + Memories + Recognize (PostgreSQL, Recognize's real face
# pipeline) for every pinned combination in tests/ci/versions.json. See CLAUDE.md.
name: Compatibility

on:
  # Branches are covered by their pull request; pushing to both would run every cell twice
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      nextcloud:
        description: "Nextcloud: image tag (35, 34.0.6), a prerelease (36.0.0beta1) or master (empty: every pinned major)"
        default: ""
      memories:
        description: "Memories release (empty: every pinned one)"
        default: ""
      recognize:
        description: "Recognize release (empty: every pinned one)"
        default: ""
      readme_media:
        description: "Also regenerate the README screenshots and animation (artifact readme-media)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Fetch the photos once here, so the matrix jobs restore them rather than all asking
      # Wikimedia Commons at once (it rate-limits)
      - name: Cache photo set
        id: photos
        uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('tests/data/manifest.json', 'tests/data/fetch.py') }}
      - name: Fetch photo set
        if: steps.photos.outputs.cache-hit != 'true'
        run: uv run --no-project --with pillow python tests/data/fetch.py .cache/photos
      - id: m
        env:
          NC: ${{ inputs.nextcloud }}
          MEM: ${{ inputs.memories }}
          REC: ${{ inputs.recognize }}
        run: |
          python3 tests/ci/versions.py matrix > all.json
          # workflow_dispatch: narrow to the versions asked for (an unpinned one is resolved from the App Store)
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          cells = json.load(open("all.json"))["include"]
          nc, mem, rec = (os.environ.get(k) or "" for k in ("NC", "MEM", "REC"))
          if nc or mem or rec:
              pinned = list(dict.fromkeys(c["nextcloud"] for c in cells))
              out = []
              for n in [nc] if nc else pinned:
                  # the pinned releases for that major (an unpinned major or prerelease: the newest pinned one's)
                  major = n.split(".")[0]
                  same = [c for c in cells if c["nextcloud"] == (major if major in pinned else pinned[-1])]
                  mems = [mem] if mem else list(dict.fromkeys(c["memories"] for c in same))
                  recs = [rec] if rec else list(dict.fromkeys(c["recognize"] for c in same))
                  out += [{"nextcloud": n, "memories": m, "recognize": r} for m in mems for r in recs]
              cells = out
          print("matrix=" + json.dumps({"include": cells}))
          EOF
          cat "$GITHUB_OUTPUT"

  compat:
    needs: matrix
    name: NC ${{ matrix.nextcloud }} · Memories ${{ matrix.memories }} · Recognize ${{ matrix.recognize }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      NEXTCLOUD_VERSION: ${{ matrix.nextcloud }}
      MEMORIES_VERSION: ${{ matrix.memories }}
      RECOGNIZE_VERSION: ${{ matrix.recognize }}
      FACETAG_CACHE: ${{ github.workspace }}/.cache
      NC_PORT: "18080"  # Nextcloud on the runner's 127.0.0.1, for the UI tests' browser
      UI_TRACE: retain-on-failure
      UI_ARTIFACTS: ${{ github.workspace }}/ui-artifacts
      MODEL_REPORT: ${{ github.workspace }}/model-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6

      # Release tarballs and Recognize's native runtime (node, CPU libtensorflow, tfjs-node binding)
      - name: Cache Memories release
        uses: actions/cache@v4
        with:
          path: .cache/apps/memories-${{ matrix.memories }}.tar.gz
          key: app-memories-${{ matrix.memories }}
      - name: Cache Recognize release and runtime
        uses: actions/cache@v4
        with:
          path: |
            .cache/apps/recognize-${{ matrix.recognize }}.tar.gz
            .cache/runtime
          key: app-recognize-${{ matrix.recognize }}-runtime-v1
      - name: Cache photo set
        uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('tests/data/manifest.json', 'tests/data/fetch.py') }}

      - name: Cache Chromium for Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('tests/ci/stack.sh') }}
      - name: Chromium
        # in the background: it is only needed once the stack is up
        # retried: Ubuntu's mirrors sometimes 404 a package the runner's apt index still lists
        run: |
          nohup sh -c 'for i in 1 2 3; do
              uv run --no-project --with "$(sed -n "s/^PLAYWRIGHT=//p" tests/ci/stack.sh)" python -m playwright install --with-deps chromium && exit 0
              sleep 20; sudo apt-get update -q
            done; exit 1' > playwright-install.log 2>&1 &

      - name: Bring up Nextcloud, Memories, Recognize, memories_facetag
        run: tests/ci/stack.sh up
      - name: Load photos, run Recognize, name its clusters
        id: dataset
        run: tests/ci/stack.sh dataset
      - name: Server-side tests
        run: tests/ci/stack.sh test --junitxml=test-results.xml
      - name: UI tests
        if: ${{ !cancelled() && steps.dataset.outcome == 'success' }}
        run: |
          # wait for the background Chromium install
          while pgrep -f "playwright install" >/dev/null; do sleep 1; done
          cat playwright-install.log | tail -3
          tests/ci/stack.sh ui --junitxml=ui-results.xml

      - name: Summary
        if: always()
        run: |
          {
            echo "### NC ${NEXTCLOUD_VERSION} · Memories ${MEMORIES_VERSION} · Recognize ${RECOGNIZE_VERSION}"
            echo '```'
            tests/ci/stack.sh occ status 2>/dev/null | grep versionstring || true
            python3 - <<'EOF' || true
          import xml.etree.ElementTree as ET
          for name, f in (("server", "test-results.xml"), ("ui", "ui-results.xml")):
              try:
                  root = ET.parse(f).getroot()
              except OSError:
                  print(f"{name}: did not run")
                  continue
              s = root if root.tag == "testsuite" else root.find("testsuite")
              print(f"{name}: tests {s.get('tests')}, failures {s.get('failures')}, errors {s.get('errors')}, time {float(s.get('time')):.0f}s")
          EOF
            python3 - <<'EOF' || true
          import json
          r = json.load(open("model-report.json"))
          print(f"face model: {r['detected']}/{r['ground_truth_faces']} ground-truth faces detected, {r['total_faces']} in all; "
                f"within-person median {r['within_person']['p50']}, between {r['between_people']['p50']}; "
                f"nearest person {r['nearest_person_accuracy']:.1%}; reference descriptors differ by up to {r['reference_descriptor_max_diff']:.2g}"
                + ("; DIFFERS: " + "; ".join(r["problems"]) if r["problems"] else ""))
          EOF
            du -sh .cache/apps .cache/runtime .cache/photos ~/.cache/ms-playwright 2>/dev/null || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Collect logs
        if: failure()
        run: tests/ci/stack.sh logs ci-logs
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-nc${{ matrix.nextcloud }}-memories${{ matrix.memories }}-recognize${{ matrix.recognize }}
          path: |
            ci-logs
            test-results.xml
            ui-results.xml
            playwright-install.log
      # Screenshots and Playwright traces of failing UI tests (npx playwright show-trace X.trace.zip,
      # or trace.playwright.dev)
      - name: Upload UI failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-nc${{ matrix.nextcloud }}-memories${{ matrix.memories }}-recognize${{ matrix.recognize }}
          path: ui-artifacts
          if-no-files-found: ignore
      - name: Tear down
        if: always()
        run: tests/ci/stack.sh down

  # js/facetag.js in the stand-in viewer (tests/ui-harness/): no stack, a minute
  ui-standin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache Chromium and PhotoSwipe
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            .cache/ui-harness
          key: standin-${{ hashFiles('tests/ci/stack.sh', 'tests/ui-harness/conftest.py') }}
      - name: Chromium (retried, as above)
        run: |
          for i in 1 2 3; do
            uv run --no-project --with "$(sed -n 's/^PLAYWRIGHT=//p' tests/ci/stack.sh)" python -m playwright install --with-deps chromium && exit 0
            sleep 20; sudo apt-get update -q
          done; exit 1
      - run: >
          uv run --no-project --with pytest --with pillow --with "$(sed -n 's/^PLAYWRIGHT=//p' tests/ci/stack.sh)"
          python -m pytest tests/ui-harness -v -p no:cacheprovider

  # By hand only: the README's screenshots and animation from the real Memories, as an artifact
  # to commit into docs/media/ (newest pinned versions). See CLAUDE.md.
  readme-media:
    if: github.event_name == 'workflow_dispatch' && inputs.readme_media
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FACETAG_CACHE: ${{ github.workspace }}/.cache
      NC_PORT: "18080"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Cache photo set
        uses: actions/cache@v4
        with:
          path: .cache/photos
          key: photos-${{ hashFiles('tests/data/manifest.json', 'tests/data/fetch.py') }}
      - name: ffmpeg and Chromium
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          uv run --no-project --with playwright python -m playwright install --with-deps chromium
      - run: tests/ci/stack.sh up
      - run: tests/ci/stack.sh dataset
      - run: uv run --no-project --with playwright python tests/readme-media/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readme-media
          path: docs/media
      - if: always()
        run: tests/ci/stack.sh down
